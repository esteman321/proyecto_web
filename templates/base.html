{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tribuna · Camisetas de fútbol{% endblock %}</title>
  <meta name="description" content="Camisetas de fútbol de selecciones y clubes, en tu talla.">
  <link rel="stylesheet" href="{% static 'css/home.css' %}">
</head>
<body>
  <header class="nav">
    <nav class="nav__inner" aria-label="Principal">
      <a class="nav__brand" href="{% url 'home' %}">Tribuna</a>
      <ul class="nav__links">
        <li><a href="{% url 'selecciones' %}">Selecciones</a></li>
        <li><a href="{% url 'ligas' seccion='clubes' %}">Clubes</a></li>
        <li><a href="{% url 'ligas' seccion='retro' %}">Retro</a></li>
        <li><a href="{% url 'catalogo' %}">Todo</a></li>
      </ul>
      <div class="nav__actions">
        <a href="{% url 'catalogo' %}" aria-label="Buscar" class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </a>
        <a href="{% url 'carrito' %}" aria-label="Carrito" class="icon-btn icon-btn--cart" id="cart-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>
          <span class="cart-badge" id="cart-badge" style="display:none">0</span>
        </a>
      </div>
    </nav>
  </header>

  <!-- Toast de notificación -->
  <div class="toast" id="toast" aria-live="polite"></div>

  <main>{% block content %}{% endblock %}</main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <p class="footer__brand">Tribuna</p>
    </div>
  </footer>

  <script src="{% static 'js/home.js' %}" defer></script>
  <script src="{% static 'js/carrito.js' %}" defer></script>
  <script>
    // Al cargar, actualiza el badge del carrito
    document.addEventListener('DOMContentLoaded', () => {
      fetch('{% url "badge_carrito" %}')
        .then(r => r.json())
        .then(d => {
          const badge = document.getElementById('cart-badge');
          if (d.badge > 0) {
            badge.textContent = d.badge;
            badge.style.display = '';
          } else {
            badge.style.display = 'none';
          }
        })
        .catch(() => {});
    });
  </script>
</body>
</html>
